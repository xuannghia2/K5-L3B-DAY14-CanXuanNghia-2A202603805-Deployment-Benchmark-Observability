services:
  - type: web
    name: day14-production-agent
    runtime: docker
    plan: free
    dockerContext: ./06-lab-complete
    dockerfilePath: ./06-lab-complete/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: AGENT_API_KEY
        generateValue: true
      - key: REDIS_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1"
      - key: MONTHLY_BUDGET_USD
        value: "10"

