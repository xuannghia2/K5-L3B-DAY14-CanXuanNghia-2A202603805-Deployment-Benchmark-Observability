services:
  agent:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8000"
      REDIS_URL: redis://redis:6379/0
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      DAILY_BUDGET_USD: ${DAILY_BUDGET_USD:-1}
      MONTHLY_BUDGET_USD: ${MONTHLY_BUDGET_USD:-10}
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 9s
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  redis-data:

